<!DOCTYPE html>
<html lang="en" data-theme="colourful-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opposites</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/shell.css">
<style>
  .opp {
    max-width: 760px; margin: 0 auto;
    min-height: calc(100dvh - var(--bar-h));
    padding: var(--s4) var(--s4) calc(var(--s6) + var(--safe-b));
    display: flex; flex-direction: column; gap: var(--s4);
  }
  .opp-top { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .opp-ctl { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex: 1 1 100%; }
  @media (min-width: 760px) { .opp-ctl { flex: 0 0 auto; } }
  .opp-title {
    margin: 0; flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: var(--s3);
    font-size: var(--t-title); line-height: 1.1; font-weight: 700;
  }
  .opp-title .mk { width: 56px; height: 56px; flex: none; color: var(--ink); }
  .opp-chips { display: flex; gap: var(--s2); }
  .opp-chips .kg-chip { min-height: 44px; padding: var(--s1) var(--s3); }
  .opp-modes { flex-wrap: nowrap; }
  .opp-modes .kg-seg__opt { flex: 0 0 auto; min-height: 52px; padding: 0 var(--s3); font-size: var(--t-body); }
  @media (max-width: 759px) { .opp-modes .kg-seg__opt span { display: none; } .opp-modes .kg-seg__opt { min-width: 56px; } }

  .opp-board {
    flex: 1; display: flex; flex-direction: column; gap: var(--s4);
    padding: var(--s4);
    background: var(--chalk); border: var(--line-w) solid var(--line); border-radius: var(--r-2);
  }
  .opp-progress { display: flex; align-items: center; gap: var(--s3); font-size: var(--t-small); color: var(--ink-2); }
  .opp-progress .kg-track { flex: 1; }
  .opp-label { margin: 0; text-align: center; font-size: var(--t-body); color: var(--ink-2); }
  .opp-word {
    margin: 0; text-align: center; font-weight: 700; line-height: 1.1;
    font-size: clamp(2.5rem, 9vmin, 5rem); overflow-wrap: anywhere;
    animation: kg-settle var(--dur-2) var(--ease) both;
  }
  .opp-choices { --cols: 2; margin-top: auto; }
  .opp-choice { font-size: var(--t-title); min-height: clamp(72px, 10vh, 100px); }
  .opp-type { display: grid; gap: var(--s3); margin-top: auto; }
  .opp-type .kg-input { font-size: var(--t-title); min-height: 76px; text-align: center; }
  .opp-type .kg-input.is-right { background: var(--right-wash); border-color: var(--right); border-width: 5px; }
  .opp-type .kg-input.is-wrong { background: var(--wrong-wash); border-color: var(--wrong); border-width: 5px; }
  .opp-hint { margin: 0; text-align: center; font-size: var(--t-small); color: var(--ink-2); }
  :root[data-age="young"] .opp-hint { display: none; }

  .opp-feedback { min-height: 2.9em; text-align: center; font-size: var(--t-lead); font-weight: 700; }
  .opp-feedback.is-right { color: var(--right); }
  .opp-feedback.is-wrong { color: var(--wrong); }
  .opp-feedback .opp-answers { margin-top: var(--s1); font-size: var(--t-small); font-weight: 400; color: var(--ink-2); }
  .opp-feedback svg { vertical-align: -6px; margin-right: var(--s2); }

  /* Confetti: paint-coloured stars, only when the child got one right */
  .particle { position: fixed; z-index: 1300; width: 28px; height: 28px; pointer-events: none; stroke: var(--line); stroke-width: 3; stroke-linejoin: round; animation: oppFall var(--dur-paint) var(--ease) forwards; animation-duration: 900ms; }
  @keyframes oppFall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(90px) rotate(200deg); } }

  /* End */
  .opp-end { display: grid; justify-items: center; gap: var(--s4); text-align: center; margin: auto 0; }
  .opp-stars { display: flex; gap: var(--s3); }
  .opp-star { width: clamp(72px, 16vmin, 120px); height: clamp(72px, 16vmin, 120px); fill: var(--paint); stroke: var(--line); stroke-width: 3; stroke-linejoin: round; animation: kg-paint-on var(--dur-paint) var(--ease) both; }
  .opp-star.off { fill: none; opacity: 0.5; animation: none; }
  .opp-star:nth-child(2) { animation-delay: 120ms; } .opp-star:nth-child(3) { animation-delay: 240ms; }
  .opp-end h2 { margin: 0; font-size: var(--t-display); line-height: 1.05; }
  .opp-end .opp-line { margin: 0; font-size: var(--t-lead); }
  .opp-end .opp-pb { margin: 0; font-size: var(--t-small); color: var(--ink-2); }
  .opp-end .kg-actions { width: 100%; max-width: 560px; justify-content: center; }
  .opp-end .kg-btn { white-space: nowrap; }

  @media (max-width: 520px) { .opp-board { padding: var(--s4); } .opp-title .mk { width: 44px; height: 44px; } }
  @media (orientation: landscape) and (max-height: 560px) { .opp-choices { --cols: 4; } .opp-choice { min-height: 80px; font-size: var(--t-lead); } }
</style>
</head>
<body data-page="opposites" data-page-title="Opposites" data-paint="blue">

<!-- Shell bar injected by build script -->

<main class="opp">
  <div class="opp-top">
    <h1 class="opp-title"><svg class="mk" viewBox="0 0 96 96" aria-hidden="true"><use href="#m-opposites"/></svg>Opposites</h1>
    <div class="opp-ctl">
    <div class="kg-seg opp-modes" role="group" aria-label="How to answer">
      <button class="kg-seg__opt" id="choiceMode" aria-pressed="true" onclick="setMode('choice')" aria-label="Choose an answer"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span>Choose</span></button>
      <button class="kg-seg__opt" id="typeMode" aria-pressed="false" onclick="setMode('type')" aria-label="Type an answer"><svg class="ic" aria-hidden="true"><use href="#i-keyboard"/></svg><span>Type</span></button>
    </div>
    <div class="opp-chips" role="group" aria-label="Score">
      <span class="kg-chip" id="correctBox"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span class="kg-sr">Right</span><strong id="correctCount">0</strong></span>
      <span class="kg-chip" id="wrongBox"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg><span class="kg-sr">Wrong</span><strong id="wrongCount">0</strong></span>
      <span class="kg-chip" id="streakBox"><svg class="ic" aria-hidden="true"><use href="#i-streak"/></svg><span class="kg-sr">In a row</span><strong id="streakCount">0</strong></span>
    </div>
    </div>
  </div>

  <section class="opp-board" id="gameCard" aria-label="Question">
    <!-- Game content injected here -->
  </section>
</main>

const BRACKET_CONFIG = {
  '4-5': { distractorCount: 2, showHint: true,  levels: { 1: 10 } },
  '6-8': { distractorCount: 3, showHint: true,  levels: { 1: 5, 2: 15 } },
  '9-12': { distractorCount: 3, showHint: false, levels: { 1: 5, 2: 15 } },
  '13+':  { distractorCount: 3, showHint: false, levels: { 1: 5, 2: 15 } },
};
let ageBracket = (window.KidsGames && window.KidsGames.player) ? window.KidsGames.player.ageBracket : '6-8';
let config = BRACKET_CONFIG[ageBracket] || BRACKET_CONFIG['6-8'];

// Saved data for the current player: lifetime stats, plus the words they missed and the words they saw lately.
let savedData = {};
let lifetimeGames = 0;
let lifetimeBestStreak = 0;
let lifetimeBestScore = 0;
const MISSED_MAX = 30;       // missed words remembered
const MISSED_PER_GAME = 3;   // missed words brought back into each new game
const RECENT_MAX = 60;       // words seen lately, avoided when a game is picked
function loadSaved() {
  savedData = (window.KidsGames && window.KidsGames.loadGameData('opposites')) || {};
  lifetimeGames = savedData.gamesPlayed || 0;
  lifetimeBestStreak = savedData.bestStreak || 0;
  lifetimeBestScore = savedData.bestScore || 0;
}
function persist() {
  if (!window.KidsGames) return;
  window.KidsGames.saveGameData('opposites', {
    gamesPlayed: lifetimeGames,
    bestStreak: lifetimeBestStreak,
    bestScore: lifetimeBestScore,
    lastPlayed: new Date().toISOString().slice(0, 10),
    missed: savedData.missed || [],
    recent: savedData.recent || [],
  });
}

// ---- SOUND: the shared shell engine, so mute works everywhere ----
function sfx(name) { if (window.KidsGames) window.KidsGames.sfx(name); }
function reduced() { return !!(window.KidsGames && window.KidsGames.reducedMotion); }

// ---- CONFETTI: paint-coloured stars (skipped under reduced motion) ----
const PAINTS = ['--paint-red', '--paint-yellow', '--paint-blue', '--paint-green', '--paint-orange'];
function spawnParticles(x, y) {
  if (reduced()) return;
  for (let i = 0; i < 6; i++) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    el.setAttribute('class', 'particle');
    el.setAttribute('viewBox', '0 0 48 48');
    el.setAttribute('aria-hidden', 'true');
    el.style.fill = 'var(' + PAINTS[i % PAINTS.length] + ')';
    el.style.left = (x + (Math.random() - 0.5) * 120) + 'px';
    el.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
    el.innerHTML = '<use href="#a-star"/>';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
}

// ---- GAME STATE ----
let mode = 'choice'; // 'choice' or 'type'
let currentIndex = 0;
let correctScore = 0;
let wrongScore = 0;
let streak = 0;
let bestStreak = 0;
let shuffledPairs = [];
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setMode(m) {
  mode = m;
  document.getElementById('choiceMode').setAttribute('aria-pressed', String(m === 'choice'));
  document.getElementById('typeMode').setAttribute('aria-pressed', String(m === 'type'));
  if (!answered) renderQuestion();
}

// Picks one game's words: a few missed words come back, then each level's quota is filled with words
// the player has not seen lately (falling back to recent ones only if the pool runs short).
function pickWords() {
  const quota = config.levels;
  const missed = new Set(savedData.missed || []);
  const recent = new Set(savedData.recent || []);
  const pool = wordPairs.filter(p => quota[p.l]);
  const picked = shuffle(pool.filter(p => missed.has(p.w))).slice(0, MISSED_PER_GAME);
  Object.keys(quota).forEach(level => {
    const have = picked.filter(p => p.l === Number(level)).length;
    const left = pool.filter(p => p.l === Number(level) && !picked.includes(p));
    const fresh = shuffle(left.filter(p => !recent.has(p.w)));
    const stale = shuffle(left.filter(p => recent.has(p.w)));
    picked.push(...fresh.concat(stale).slice(0, Math.max(0, quota[level] - have)));
  });
  return shuffle(picked);
}

function startGame() {
  loadSaved();
  shuffledPairs = pickWords();
  savedData.recent = (savedData.recent || []).filter(w => !shuffledPairs.some(p => p.w === w))
    .concat(shuffledPairs.map(p => p.w)).slice(-RECENT_MAX);
  persist();
  currentIndex = 0;
  correctScore = 0;
  wrongScore = 0;
  streak = 0;
  bestStreak = 0;
  updateScores();
  sfx('start');
  renderQuestion();
}

function updateScores() {
  document.getElementById('correctCount').textContent = correctScore;
  document.getElementById('wrongCount').textContent = wrongScore;
  document.getElementById('streakCount').textContent = streak;
}

function escAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function renderQuestion() {
  answered = false;
  const pair = shuffledPairs[currentIndex];
  const card = document.getElementById('gameCard');
  const pct = Math.round((currentIndex / shuffledPairs.length) * 100);

  let html = `
    <div class="opp-progress">
      <span>Question ${currentIndex + 1} of ${shuffledPairs.length}</span>
      <div class="kg-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="kg-track__fill" style="width:${pct}%"></div></div>
    </div>
    <p class="opp-label">What is the opposite of...</p>
    <h2 class="opp-word">${capitalize(pair.w)}</h2>
  `;

  if (mode === 'choice') {
    // Pick 1 correct answer and N distractors (only from this word's own distractor list)
    const correctOne = pair.a[Math.floor(Math.random() * pair.a.length)];
    const wrongOnes = shuffle(pair.d).slice(0, config.distractorCount);
    const options = shuffle([correctOne, ...wrongOnes]);

    html += `<div class="kg-tiles opp-choices" role="group" aria-label="Answers">`;
    options.forEach((opt, i) => {
      html += `<button class="kg-tile opp-choice" id="opt${i}" data-opt="${escAttr(opt)}" onclick="checkChoice(this, this.dataset.opt)">${capitalize(opt)}</button>`;
    });
    html += `</div>`;
  } else {
    html += `
      <div class="opp-type">
        <label class="kg-sr" for="typeInput">Type the opposite</label>
        <input class="kg-input" id="typeInput" type="text" placeholder="Type the opposite..." autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button class="kg-btn kg-btn--block" onclick="checkTyped()"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span>Check</span></button>
      </div>
    `;
    if (config.showHint) html += `<p class="opp-hint">Any correct opposite counts!</p>`;
  }

  html += `<div class="opp-feedback" id="feedback" role="status" aria-live="polite"></div>`;
  card.innerHTML = html;

  if (mode === 'type') {
    const input = document.getElementById('typeInput');
    input.focus();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkTyped();
    });
  }
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function checkChoice(btn, chosen) {
  if (answered) return;
  answered = true;
  const pair = shuffledPairs[currentIndex];
  const isCorrect = pair.a.includes(chosen.toLowerCase());

  const fb = document.getElementById('feedback');
  document.querySelectorAll('.opp-choice').forEach(b => { b.disabled = true; });
  if (isCorrect) {
    btn.classList.add('is-right');
    handleCorrect(fb, pair, btn);
  } else {
    btn.classList.add('is-wrong');
    handleWrong(fb, pair);
    // Show a correct one
    document.querySelectorAll('.opp-choice').forEach(b => {
      if (pair.a.includes(b.textContent.trim().toLowerCase())) {
        setTimeout(() => b.classList.add('is-right'), 400);
      }
    });
  }
}

// Typed answers are matched exactly against the curated list: the answers, plus the informal words and common
// misspellings listed for the word (pair.t). Letters only, so capitals, spaces and punctuation do not matter.
// There is deliberately no stemmer and no fuzzy matching: either would accept real wrong words.
function cleanTyped(s) { return s.toLowerCase().replace(/[^a-z]/g, ''); }

function checkTyped() {
  if (answered) return;
  const input = document.getElementById('typeInput');
  const typed = cleanTyped(input.value);
  if (!typed) return;

  answered = true;
  const pair = shuffledPairs[currentIndex];
  const isCorrect = pair.a.includes(typed) || pair.t.includes(typed);

  const fb = document.getElementById('feedback');
  input.disabled = true;
  if (isCorrect) {
    input.classList.add('is-right');
    handleCorrect(fb, pair, input);
  } else {
    input.classList.add('is-wrong');
    handleWrong(fb, pair);
  }
}

const TICK = '<svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>';
const CROSS = '<svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>';

function handleCorrect(fb, pair, el) {
  savedData.missed = (savedData.missed || []).filter(w => w !== pair.w);
  persist();
  correctScore++;
  streak++;
  if (streak > bestStreak) bestStreak = streak;
  updateScores();
  sfx('right');

  const rect = el.getBoundingClientRect();
  spawnParticles(rect.left + rect.width / 2, rect.top);

  const messages = ['Amazing!', 'You got it!', 'Super!', 'Wow!', 'Nailed it!', 'Brilliant!', 'Yes!'];
  fb.className = 'opp-feedback is-right';
  fb.innerHTML = TICK + messages[Math.floor(Math.random() * messages.length)];
  fb.innerHTML += `<div class="opp-answers">Also accepted: ${pair.a.map(capitalize).join(', ')}</div>`;

  setTimeout(nextQuestion, 1800);
}

function handleWrong(fb, pair) {
  savedData.missed = [pair.w].concat((savedData.missed || []).filter(w => w !== pair.w)).slice(0, MISSED_MAX);
  persist();
  wrongScore++;
  streak = 0;
  updateScores();
  sfx('wrong');

  const messages = ['Not quite!', 'Oops!', 'Try again next time!', 'So close!'];
  fb.className = 'opp-feedback is-wrong';
  fb.innerHTML = CROSS + messages[Math.floor(Math.random() * messages.length)];
  fb.innerHTML += `<div class="opp-answers">Correct answers: ${pair.a.map(capitalize).join(', ')}</div>`;

  setTimeout(nextQuestion, 2200);
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= shuffledPairs.length) {
    showEndScreen();
  } else {
    renderQuestion();
  }
}

function showEndScreen() {
  // Update and save lifetime stats
  lifetimeGames++;
  if (bestStreak > lifetimeBestStreak) lifetimeBestStreak = bestStreak;
  if (correctScore > lifetimeBestScore) lifetimeBestScore = correctScore;
  persist();
  if (window.KidsGames) window.KidsGames.recordSession('opposites');
  sfx('win');
  const pct = Math.round((correctScore / shuffledPairs.length) * 100);
  const filled = pct >= 90 ? 3 : pct >= 70 ? 2 : 1; // always at least one painted star

  let message = '';
  if (pct >= 90) message = 'You\'re an Opposites Champion!';
  else if (pct >= 70) message = 'Great job!';
  else if (pct >= 50) message = 'Good effort!';
  else message = 'Keep practising!';

  const starsHtml = [1, 2, 3].map(i =>
    '<svg class="opp-star' + (i > filled ? ' off' : '') + '" viewBox="0 0 48 48" aria-hidden="true"><use href="#a-star"/></svg>').join('');

  const card = document.getElementById('gameCard');
  card.innerHTML = `
    <div class="opp-end">
      <div class="opp-stars" aria-hidden="true">${starsHtml}</div>
      <h2>${message}</h2>
      <p class="opp-line">${correctScore} out of ${shuffledPairs.length} right (${pct}%)</p>
      <p class="opp-line">Best streak: ${bestStreak}</p>
      ${lifetimeGames > 1 ? `<p class="opp-pb">Personal best: ${lifetimeBestScore} · Best streak: ${lifetimeBestStreak} · Games: ${lifetimeGames}</p>` : ''}
      <div class="kg-actions">
        <button class="kg-btn" id="oppAgain" onclick="startGame()"><svg class="ic" aria-hidden="true"><use href="#i-replay"/></svg><span>Play again</span></button>
        <a class="kg-btn kg-btn--ghost" href="index.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>All games</span></a>
      </div>
    </div>
  `;
  document.getElementById('oppAgain').focus({ preventScroll: true });

  if (!reduced()) {
    setTimeout(() => {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => spawnParticles(
          window.innerWidth / 2 + (Math.random() - 0.5) * 200,
          window.innerHeight / 3
        ), i * 200);
      }
    }, 300);
  }
}

// ---- START ----
startGame();

// Re-apply age bracket if player is selected after page load (e.g. first visit, cache clear)
if (window.KidsGames) {
  window.KidsGames.onPlayerChange(function(ctx) {
    const newBracket = ctx ? ctx.ageBracket : '6-8';
    if (newBracket !== ageBracket) {
      ageBracket = newBracket;
      config = BRACKET_CONFIG[ageBracket] || BRACKET_CONFIG['6-8'];
      startGame();
    }
  });
}
