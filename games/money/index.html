<!DOCTYPE html>
<html lang="en" data-theme="colourful-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/shell.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="money" data-page-title="Money" data-paint="pink">

<!-- Shell bar injected by build script -->

<div id="mo-app">

  <!-- SCREEN 1: settings -->
  <div id="mo-settings" class="kg-screen mo-screen">
    <div class="kg-wrap">
      <h1 class="kg-title kg-title--paint">
        <span class="mk mo-mark" id="mo-mark" aria-hidden="true"></span>
        Money
      </h1>

      <fieldset class="mo-fieldset">
        <legend class="kg-label">What shall we do?</legend>
        <div class="kg-seg mo-acts" id="mo-act-row" role="group" aria-label="What shall we do?"><!-- filled by main.js --></div>
      </fieldset>

      <fieldset class="mo-fieldset">
        <legend class="kg-label">How far apart?</legend>
        <div class="kg-seg mo-levels" id="mo-level-row" role="group" aria-label="How far apart?"><!-- filled by main.js --></div>
      </fieldset>

      <p class="mo-note" id="mo-note"></p>
    </div>

    <div class="kg-dock">
      <button class="kg-btn kg-btn--block" id="mo-play-btn" type="button"><svg class="ic ic--lg" aria-hidden="true"><use href="#i-play"/></svg><span>Play!</span></button>
    </div>
  </div>

  <!-- SCREEN 2: the game (Which costs more?, Put in order, Can you buy it?) -->
  <div id="mo-game" class="kg-screen mo-screen mo-screen--game" hidden>
    <div class="kg-wrap mo-play">
      <div class="kg-hud">
        <button type="button" class="kg-iconbtn" id="mo-stop" aria-label="Stop playing"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        <span class="kg-squares mo-progress" id="mo-progress" role="img"></span>
        <span class="kg-hud__fill"></span>
      </div>
      <h2 class="mo-prompt" id="mo-prompt">Which costs more?</h2>
      <div class="mo-cards" id="mo-cards" role="group" aria-label="Choices"></div>
      <div class="mo-sort" id="mo-sort" role="group" aria-label="Put in order" hidden></div>
      <p class="mo-caption is-off" id="mo-caption"></p>
      <div class="mo-nextdock">
        <button type="button" class="kg-btn" id="mo-next" hidden><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg><span id="mo-next-label">Next</span></button>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: results (kept simple for now) -->
  <div id="mo-results" class="kg-screen mo-screen" hidden>
    <div class="kg-wrap" style="align-items:center;text-align:center">
      <h2 class="kg-title" id="mo-results-title">Well done!</h2>
      <span class="kg-squares mo-done-squares" id="mo-done-squares" role="img" aria-label="Ten questions done"></span>
      <div class="kg-actions mo-results-actions">
        <button type="button" class="kg-btn" id="mo-again"><svg class="ic" aria-hidden="true"><use href="#i-replay"/></svg><span>Play again</span></button>
        <button type="button" class="kg-btn kg-btn--ghost" id="mo-change"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span>Change</span></button>
      </div>
    </div>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
